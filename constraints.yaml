schema_version: "3.5.8"
project:
  name: "Harmonizing Intelligence Lab website"
  type: "nextjs-frontend"
  source_of_truth: "Ticket 001 Photoshop delivery manifest and current src/public implementation; Figma is provenance only"

strictness_profile:
  level: "L3"
  chosen_by_user: true
  anti_drift:
    duplicate_code:
      threshold: 3
      severity: "block"
      status: "readiness gap: review gate is recorded but not automated"
    dead_code_unused_exports:
      threshold: 80
      severity: "block"
      status: "readiness gap: dead-code tool is not configured"
    naming_and_scratch_paths:
      severity: "block"
      status: "enforced by local guard and CI"
  downgraded_controls:
    - control: "local pre-commit wiring"
      reason: "no hook manager is currently present"
      replacement: "CI and explicit make guard targets"

canonicality:
  source_dirs:
    - "src"
    - "public"
  archive_reference: "../labWebSite-archive/"
  forbidden_path_patterns:
    - "_v[0-9]+"
    - "_new"
    - "_old"
    - "_backup"
    - "_temp"
    - "_copy"
    - "_final"
    - "_real"
    - "_improved"
    - "_refactored"
    - "_fixed"
    - "_legacy"
    - "_deprecated"
    - "V[0-9]+"
    - "New$"
    - "Old$"
    - "Backup$"
    - "Temp$"
    - "Copy$"
    - "Final$"
    - "Real$"
    - "Improved$"
    - "Refactored$"
    - "Fixed$"
    - "Legacy$"
    - "Deprecated$"
  forbidden_scratch_directories:
    - "tmp"
    - "scratch"
    - "backup"
    - "_old"
    - "deprecated"
    - "archive"
    - "wip"

size_limits:
  max_agents_lines: 320
  max_file_lines: 800
  max_function_lines: 80
  max_pr_diff_lines: 400
  max_pr_diff_severity: "block"
  diff_size_exclusions: ["docs/labWebsiteV1/features.json", "docs/labWebsiteV1/validation-contract.json"]
  diff_size_exclusion_reason: "deterministic devflow compile outputs; source spec and tickets remain counted"

verification:
  - surface: "repository"
    command: "make check"
    status: "passed in 031 after clean npm ci; see release evidence index"
  - surface: "guardrails"
    command: "make check-guardrails"
    status: "available"
  - surface: "guard self-test"
    command: "make test-guardrails"
    status: "available"
  - surface: "critical UI"
    route: "/"
    tool: "Playwright"
    command: "npm run test:e2e"
    status: "available; production web server starts automatically"
  - surface: "health"
    route: "/healthz"
    status: "available; production build and HTTP response verified"

critical_paths:
  - route: "/"
    command: "npm run test:e2e"
    expectation: "seven bilingual screens, navigation, CTA, locale/reset, normal/reduced motion, mobile menu, carousels, disclosures, filters and contact actions pass"

rehabilitation:
  active: false
  phase: "verified-local-v1"
  baseline_frozen: true
  baseline_commit: "ffc8cf6e948aa30e65fe1b660d6ac50ad76d077f"
  completed_at: "2026-09-08T02:48:08.754302+00:00"
  completion_evidence: "docs/design-references/hil-site/release/evidence-index.md"
  command_entrypoint: "make check-release"
  runtime_verifier: "make check-ui (includes /healthz); 84 passed in 031"
  broad_refactor_allowed: false
  work_unit_protocol: "one focused change, then run the relevant make target and report evidence"
  owner: "single owner"
  readiness_gaps: []
  remaining_limits:
    - "031 independent review and 032 final verification pending"
    - "remote CI, gitleaks and CodeQL not executed in this local mission"
    - "npm ci reports 18 dependency advisories; no dependency upgrade in 031"
    - "public media rights confirmation remains pending; no deployment"

refactor:
  active: false
  broad_refactor_allowed: false
  compare_command: ""
  completion_evidence: []

environments:
  local: "repository checkout"
  staging: null
  production: null

exemptions: []

generated_sections:
  preserve_unknown_sections: true
  agents_md:
    - title: "Code Canonicality"
    - title: "Project Identity"
    - title: "Stack & Versions"
    - title: "Directory Map"
    - title: "Development Workflow"
    - title: "Verification Matrix"
    - title: "Source of Truth & Refactor Contract"
    - title: "Important Development Notes"
    - title: "Conventions"
    - title: "Code Review Self-Check"
    - title: "Architecture Discipline"
    - title: "Critical Paths"
    - title: "Observability"
    - title: "Agent Operating Rules"
    - title: "Runtime Lifecycle"
    - title: "Enforcement Index"

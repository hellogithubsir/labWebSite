name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: make test-guardrails
      - run: make check-guardrails

  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: make check

  critical_ui:
    name: Critical UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: make check-ui

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  diff-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce PR diff limit
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [[ "$base" =~ ^0+$ ]]; then
            base="$(git rev-list --max-parents=0 HEAD)"
          fi
          max_lines="$(awk '/max_pr_diff_lines:/ {print $2}' constraints.yaml)"
          changed="$(git diff --numstat "$base" "${{ github.sha }}" -- . ':(exclude)docs/labWebsiteV1/features.json' ':(exclude)docs/labWebsiteV1/validation-contract.json' | awk '{added += $1; deleted += $2} END {print added + deleted + 0}')"
          if (( changed > max_lines )); then
            echo "diff-size: $changed changed lines exceed limit $max_lines" >&2
            exit 1
          fi
          echo "diff-size: $changed changed lines within limit $max_lines"

  all-checks-passed:
    if: always()
    needs:
      - guardrails
      - frontend-quality
      - critical_ui
      - secret-scan
      - sast
      - diff-size
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any blocking result failed or skipped
        shell: bash
        run: |
          results=("${{ needs.guardrails.result }}" "${{ needs.frontend-quality.result }}" "${{ needs.critical_ui.result }}" "${{ needs.secret-scan.result }}" "${{ needs.sast.result }}" "${{ needs.diff-size.result }}")
          for result in "${results[@]}"; do
            if [[ "$result" =~ ^(failure|cancelled|skipped)$ ]]; then
              echo "all-checks-passed: blocking job result is $result" >&2
              exit 1
            fi
          done
          echo "all-checks-passed: every blocking job passed"
